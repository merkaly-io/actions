name: Setup
description: Checkout, setup Node, and install dependencies

runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        fetch-tags: true

    - run: corepack enable
      shell: bash

    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash

    - if: ${{ startsWith(github.ref, 'refs/tags/v') }}
      run: npm pkg set version="${GITHUB_REF_NAME#v}" # releases: the tag is the version, master never carries the bump
      shell: bash
