name: Publish
description: Validate tag, configure npm registry and publish package

runs:
  using: composite
  steps:
    - run: |
        git fetch origin master --force --tags
        git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      shell: bash

    - run: | # setup already wrote the tag version into package.json
        echo "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
        test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      shell: bash

    - run: pnpm pack --dry-run
      shell: bash

    - uses: actions/setup-node@v6
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org

    - run: pnpm publish --access public --no-git-checks
      shell: bash
